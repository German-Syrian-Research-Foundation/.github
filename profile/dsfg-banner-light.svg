<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="German-Syrian Research Foundation (DSFG) — Active Minds, Productive Ideas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#263D95"/>
      <stop offset="60%" stop-color="#1E3178"/>
      <stop offset="100%" stop-color="#16255A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34BA9C"/>
      <stop offset="100%" stop-color="#34BA9C" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>

    <!-- decorative network: knowledge bridge motif -->
    <g stroke="#34BA9C" stroke-opacity="0.30" stroke-width="1.5" fill="none">
      <path d="M905 120 L1010 72 L1130 118 L1205 84"/>
      <path d="M905 120 L975 196 L1082 214 L1180 168"/>
      <path d="M1010 72 L975 196"/>
      <path d="M1130 118 L1082 214"/>
      <path d="M1130 118 L975 196"/>
      <path d="M1205 84 L1180 168"/>
      <path d="M1010 72 L1130 118"/>
      <path d="M905 120 L1082 214"/>
    </g>
    <g fill="#34BA9C">
      <circle cx="905" cy="120" r="7"/>
      <circle cx="1010" cy="72" r="5"/>
      <circle cx="1130" cy="118" r="9"/>
      <circle cx="1205" cy="84" r="4"/>
      <circle cx="975" cy="196" r="6"/>
      <circle cx="1082" cy="214" r="8"/>
      <circle cx="1180" cy="168" r="5"/>
    </g>

    <!-- accent bar -->
    <rect x="0" y="0" width="10" height="320" fill="#34BA9C"/>
    <rect x="72" y="96" width="88" height="5" rx="2.5" fill="url(#accent)"/>

    <g font-family="Poppins, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
      <text x="72" y="80" fill="#34BA9C" font-size="21" font-weight="600" letter-spacing="5.5">DSFG · GITHUB</text>
      <text x="72" y="166" fill="#FFFFFF" font-size="52" font-weight="700" letter-spacing="-0.5">German-Syrian Research Foundation</text>
      <text x="72" y="212" fill="#C8D2F0" font-size="25" font-weight="400">Deutsch-Syrische Forschungsstiftung e.V. · Frankfurt am Main</text>
      <text x="72" y="266" fill="#8FA4DC" font-size="21" font-weight="400" font-style="italic">&#8220;Active Minds, Productive Ideas&#8221;</text>
    </g>
  </g>
</svg>
